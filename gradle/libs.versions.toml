ksp= "2.3.6"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.1.4"
kotlinJson = "1.11.0"
media3UiCompose = "1.11.0"
media3UiComposeMaterial3 = "1.11.0"
navVersion = "2.9.1"
